packages:
  - apps/*
  - packages/*

# React Native / Metro need a flat node_modules.
nodeLinker: hoisted
autoInstallPeers: true
strictPeerDependencies: false

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
  workerd: true
  sharp: true
  '@sentry/cli': true

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types'
  - '@expo/schema-utils@58.0.3'
  - expo-build-properties@58.0.12
  - expo-updates@58.0.20
  - '@expo/cli@58.1.18'
  - '@expo/config@58.0.10'
  - '@expo/fingerprint@0.21.8'
  - '@expo/local-build-cache-provider@58.0.10'
  - '@expo/log-box@58.0.14'
  - '@expo/metro-config@58.0.20'
  - '@expo/prebuild-config@58.0.18'
  - '@expo/router-server@58.0.20'
  - babel-preset-expo@58.0.23
  - expo-modules-core@58.0.29
  - expo@58.0.22
  - '@expo/metro-runtime@58.0.16'
  - expo-router@58.0.29
  - expo-sqlite@58.0.15
  - expo-dev-client@58.0.18
  - expo-dev-launcher@58.0.18
