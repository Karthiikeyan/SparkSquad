packages:
  - apps/*
  - packages/*

# React Native / Metro need a flat node_modules.
nodeLinker: hoisted
autoInstallPeers: true
strictPeerDependencies: false

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
  workerd: true
  sharp: true

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types'
