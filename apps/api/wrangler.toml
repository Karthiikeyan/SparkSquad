name = "sparksquad-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Secure default for deploys. Local dev sets APP_ENV=development in .dev.vars (see .dev.vars.example);
# tests set APP_ENV=test in vitest.config.mts.
APP_ENV = "production"
PAYMENTS_ENABLED = "false"
MIN_APP_VERSION = "1.0.0"
PUBLIC_API_URL = "https://sparksquad-api.sparksquad-api.workers.dev"
# Comma-separated list of admin emails (non-secret, but override per environment).
ADMIN_EMAILS = "karthikinfovlogs@gmail.com"
# Sender for OTP emails; must be a verified Resend domain in production.
EMAIL_FROM = "SparkSquad <karthikeyan@sparktime.in>"
ANDROID_STORE_URL = "https://play.google.com/store/apps/details?id=com.sparktribe.sparksquad"
IOS_STORE_URL = "https://apps.apple.com/app/sparksquad"
R2_BUCKET_NAME = "sparksquad"
CONTACT_EMAIL = "karthikeyan@sparktime.in"
# Display prices for the pilot paywall while PAYMENTS_ENABLED=false (leave empty to hide).
# Real prices always come from RevenueCat offerings when payments are on.
PRICE_PLUS_MONTHLY = ""
PRICE_PLUS_YEARLY = ""
PRICE_SQUAD_PRO_MONTHLY = ""
PRICE_SQUAD_PRO_YEARLY = ""

# Secrets (set with `wrangler secret put NAME`, or in .dev.vars for local dev):
# BETTER_AUTH_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_IOS_CLIENT_ID,
# GOOGLE_ANDROID_CLIENT_ID, APPLE_CLIENT_ID, APPLE_APP_BUNDLE_IDENTIFIER, APPLE_CLIENT_SECRET,
# RESEND_API_KEY, REVENUECAT_WEBHOOK_SECRET, EXPO_ACCESS_TOKEN,
# R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ACCOUNT_ID

[[d1_databases]]
binding = "DB"
database_name = "sparksquad"
database_id = "3c5e65e0-4628-4a08-b1f2-55c700d20698"
migrations_dir = "src/db/migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "sparksquad"

# Workers Rate Limiting binding (per user and per IP).
[[ratelimits]]
name = "USER_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "1002"
simple = { limit = 300, period = 60 }

[triggers]
crons = ["0 * * * *"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true
