<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#FFB224;text-decoration:none}a:hover{color:#FFC75C}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #F5F5F7; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden; padding: 60px 16px 0">

  <header style="display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 20px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -0.5px; line-height: 40px">Today</h1>
      <p style="margin: 0; font-size: 15px; color: #A1A1A8">Saturday, 31 October</p>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="Profile.dc.html" aria-label="12-day streak" style="display: flex; align-items: center; gap: 4px; height: 36px; padding: 0 12px; border-radius: 18px; background: rgba(255,178,36,0.14); color: #FFB224; font-size: 15px; font-weight: 600">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 21c-3.9 0-6.5-2.6-6.5-6.2 0-3.2 2.1-5.3 3.8-7.3.5 1.8 1.4 3 2.7 3.6-.2-2.9.8-5.6 3.1-8.1.5 3.3 3.4 5.6 3.4 10.6 0 4.3-2.7 7.4-6.5 7.4z"/></svg>
        12
      </a>
      <button aria-label="Notifications" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #151517; color: #F5F5F7; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 21h4"/></svg>
      </button>
    </div>
  </header>

  <section style="background: #151517; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <a href="Squad.dc.html" style="display: flex; justify-content: space-between; align-items: flex-start; color: #F5F5F7">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 22px; font-weight: 600; line-height: 26px">DSA 60</span>
        <span style="font-size: 13px; color: #A1A1A8">Placement Squad 7</span>
      </div>
      <span style="font-size: 13px; color: #A1A1A8; font-variant-numeric: tabular-nums; padding-top: 4px">Day 12 of 60</span>
    </a>

    <div style="display: flex; align-items: center; gap: 12px">
      <div style="display: flex; padding-left: 4px" aria-hidden="true">
        <sc-for list="{{members}}" as="m" hint-placeholder-count="9">
          <span style="{{m.style}}">{{m.init}}</span>
        </sc-for>
      </div>
      <span style="font-size: 13px; color: #A1A1A8">6 of 9 checked in</span>
    </div>

    <div style="display: flex; flex-direction: column">
      <sc-for list="{{tasks}}" as="t" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-top: 0.5px solid rgba(84,84,88,0.6)">
          <button onClick="{{t.toggle}}" aria-label="{{t.aria}}" style="{{t.boxStyle}}">
            <sc-if value="{{t.done}}" hint-placeholder-val="{{false}}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#04140C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            </sc-if>
          </button>
          <div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; padding: 8px 0">
            <span style="{{t.titleStyle}}">{{t.title}}</span>
            <span style="font-size: 13px; color: #A1A1A8">{{t.meta}}</span>
          </div>
        </div>
      </sc-for>
    </div>

    <a href="CheckIn.dc.html" style="{{checkStyle}}">{{checkLabel}}</a>
  </section>

  <section style="margin-top: 12px; background: #151517; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: flex-start">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 22px; font-weight: 600; line-height: 26px">10K steps</span>
        <span style="font-size: 13px; color: #A1A1A8">Morning Walkers</span>
      </div>
      <span style="font-size: 13px; color: #A1A1A8; padding-top: 4px">Day 9 of 30</span>
    </div>
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 30px; font-weight: 600; line-height: 34px; font-variant-numeric: tabular-nums">7,240 <span style="font-family: Inter, sans-serif; font-size: 15px; font-weight: 400; color: #A1A1A8">of 10,000 steps</span></span>
        <span style="font-size: 13px; color: #A1A1A8">Synced from Health Connect</span>
      </div>
      <a href="CheckIn.dc.html" style="height: 44px; padding: 0 18px; border-radius: 14px; background: rgba(255,178,36,0.14); color: #FFB224; font-size: 15px; font-weight: 600; display: flex; align-items: center">Check in</a>
    </div>
    <div style="height: 6px; border-radius: 3px; background: #2A2A2E; overflow: hidden"><div style="width: 72%; height: 6px; background: #FFB224; border-radius: 3px"></div></div>
  </section>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: rgba(14,14,16,0.94); border-top: 0.5px solid rgba(84,84,88,0.6); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; padding-top: 6px; box-sizing: border-box">
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #FFB224; font-size: 11px; font-weight: 500; padding-top: 4px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>Today</a>
    <a href="Squad.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #9A9AA0; font-size: 11px; font-weight: 500; padding-top: 4px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/></svg>Squads</a>
    <a href="CheckIn.dc.html" aria-label="Check in" style="justify-self: center; width: 56px; height: 56px; margin-top: -14px; border-radius: 28px; background: #FFB224; color: #1A1200; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(255,178,36,0.28)">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></a>
    <a href="Discover.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #9A9AA0; font-size: 11px; font-weight: 500; padding-top: 4px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Discover</a>
    <a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #9A9AA0; font-size: 11px; font-weight: 500; padding-top: 4px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20.5c1.2-4 4.3-6 8-6s6.8 2 8 6"/></svg>You</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: { a: false, b: true, c: false } };
  }
  renderVals() {
    var done = this.state.done;
    var self = this;
    var base = [
      { id: 'a', title: 'Solve 2 medium array problems', meta: '1 of 2 problems, auto-checks from LeetCode' },
      { id: 'b', title: 'Watch the sliding window lesson', meta: '30 minutes' },
      { id: 'c', title: 'Write notes on today’s patterns', meta: 'Tap to mark done' }
    ];
    var tasks = base.map(function (t) {
      var d = !!done[t.id];
      return {
        title: t.title,
        meta: t.meta,
        done: d,
        aria: (d ? 'Mark not done: ' : 'Mark done: ') + t.title,
        boxStyle: 'width: 44px; height: 44px; flex: none; border: 0; padding: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; margin-left: -8px; ' + (d ? 'background-image: radial-gradient(circle, #3DDC97 13px, transparent 13.5px);' : 'background-image: radial-gradient(circle, transparent 11.5px, #5A5A60 12px, #5A5A60 13.5px, transparent 14px);'),
        titleStyle: 'font-size: 15px; font-weight: 500; line-height: 20px; color: ' + (d ? '#A1A1A8' : '#F5F5F7') + ';',
        toggle: function () {
          var next = Object.assign({}, self.state.done);
          next[t.id] = !next[t.id];
          self.setState({ done: next });
        }
      };
    });
    var count = tasks.filter(function (t) { return t.done; }).length;
    var all = count === tasks.length;
    var palette = ['#3B3A5C', '#2F4A45', '#4A3A2F', '#3A2F4A', '#2F3F4A', '#4A2F3A', '#3F4A2F', '#2F2F4A', '#4A442F'];
    var inits = ['DV', 'AR', 'SK', 'ME', 'RH', 'KV', 'VG', 'NI', 'You'];
    var checked = [true, true, true, true, true, false, false, false, all];
    var members = inits.map(function (s, i) {
      var ring = checked[i] ? 'box-shadow: 0 0 0 2px #151517, 0 0 0 4px #FFB224;' : 'box-shadow: 0 0 0 2px #151517;';
      return {
        init: s === 'You' ? 'Y' : s,
        style: 'width: 28px; height: 28px; border-radius: 14px; margin-left: ' + (i === 0 ? '0' : '-6px') + '; background: ' + palette[i] + '; color: #E6E6EA; font-size: 10.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; ' + ring
      };
    });
    return {
      tasks: tasks,
      members: members,
      checkLabel: all ? 'All done. Check in now' : 'Check in (' + count + ' of 3 done)',
      checkStyle: 'height: 52px; border-radius: 14px; background: #FFB224; color: #1A1200; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center;'
    };
  }
}
</script>
</body>
</html>
