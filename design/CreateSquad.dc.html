<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create squad: set up the plan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#FFB224;text-decoration:none}a:hover{color:#FFC75C}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #F5F5F7; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden; padding: 52px 16px 34px; display: flex; flex-direction: column">

  <div style="display: flex; justify-content: space-between; align-items: center; height: 44px">
    <a href="Main.dc.html" style="font-size: 17px">Cancel</a>
    <span style="font-size: 13px; color: #A1A1A8">Step 2 of 3</span>
    <span style="width: 52px"></span>
  </div>
  <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; margin: 4px 0 20px">
    <div style="height: 3px; border-radius: 2px; background: #FFB224"></div>
    <div style="height: 3px; border-radius: 2px; background: #FFB224"></div>
    <div style="height: 3px; border-radius: 2px; background: #2A2A2E"></div>
  </div>

  <h1 style="margin: 0; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 28px; font-weight: 700; line-height: 34px; letter-spacing: -0.3px">How should the plan start?</h1>
  <p style="margin: 6px 0 18px; font-size: 15px; line-height: 21px; color: #A1A1A8">Placement Squad 7, private, career. Members follow the same plan, and you can edit any day later.</p>

  <div style="display: flex; flex-direction: column; background: #151517; border-radius: 18px; overflow: hidden">
    <sc-for list="{{options}}" as="o" hint-placeholder-count="5">
      <a href="{{o.href}}" style="{{o.rowStyle}}">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: rgba(255,178,36,0.14); color: #FFB224; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.icon}}"></path></svg>
        </span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="display: flex; align-items: center; gap: 8px">
            <span style="font-size: 16px; font-weight: 600; color: #F5F5F7">{{o.title}}</span>
            <sc-if value="{{o.tag}}" hint-placeholder-val="{{false}}">
              <span style="font-size: 11px; font-weight: 600; color: #3DDC97; background: rgba(61,220,151,0.12); border-radius: 6px; padding: 2px 6px">{{o.tag}}</span>
            </sc-if>
          </span>
          <span style="font-size: 13px; line-height: 18px; color: #A1A1A8">{{o.desc}}</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6E75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
      </a>
    </sc-for>
  </div>

  <div style="flex: 1"></div>
  <p style="margin: 0; font-size: 13px; line-height: 18px; color: #8E8E95; text-align: center">Plans use one open format, so a plan made anywhere can be imported here and shared with other squads.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var list = [
      { title: 'Use a template', desc: 'Ready-made plans like DSA 30, Aptitude 21 and 10K steps', href: 'Discover.dc.html', icon: 'M4 5.5h7v7H4zM13 5.5h7v7h-7zM4 14.5h7v4H4zM13 14.5h7v4h-7z', tag: '' },
      { title: 'Import a plan file', desc: 'Paste or upload a SparkSquad plan in JSON', href: 'ImportPlan.dc.html', icon: 'M14 3.5H7A2.5 2.5 0 0 0 4.5 6v12A2.5 2.5 0 0 0 7 20.5h10a2.5 2.5 0 0 0 2.5-2.5V9zM14 3.5V9h5.5M12 17v-5M9.5 14.5L12 12l2.5 2.5', tag: '' },
      { title: 'Build it with your AI', desc: 'Copy our prompt into ChatGPT, Gemini or Claude, answer its questions, paste the result', href: 'AIPrompt.dc.html', icon: 'M20 12a8 8 0 0 1-11.8 7L4 20l1.1-4A8 8 0 1 1 20 12zM8.5 12h.01M12 12h.01M15.5 12h.01', tag: 'Free' },
      { title: 'Generate in the app', desc: 'Same interview inside SparkSquad, using your own API key', href: 'AIBuild.dc.html', icon: 'M8 10.5V8a4 4 0 0 1 8 0v2.5M5 10.5h14v10H5zM12 14.5v2', tag: '' },
      { title: 'Start blank', desc: 'Add tasks day by day yourself', href: '#', icon: 'M12 5v14M5 12h14', tag: '' }
    ];
    var options = list.map(function (o, i) {
      return Object.assign({}, o, {
        rowStyle: 'display: flex; align-items: center; gap: 14px; padding: 14px 16px; ' + (i ? 'border-top: 0.5px solid rgba(84,84,88,0.6);' : '')
      });
    });
    return { options: options };
  }
}
</script>
</body>
</html>
