<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leaderboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#FFB224;text-decoration:none}a:hover{color:#FFC75C}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #F5F5F7; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden; padding: 52px 16px 0">

  <div style="display: flex; align-items: center; height: 44px">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 2px; font-size: 17px; margin-left: -6px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Squads</a>
  </div>
  <h1 style="margin: 4px 0 2px; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 28px; font-weight: 700; line-height: 34px; letter-spacing: -0.3px">Placement Squad 7</h1>
  <p style="margin: 0 0 14px; font-size: 15px; color: #A1A1A8">DSA 60, day 12 of 60, 9 members</p>

  <nav aria-label="Squad sections" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #1C1C1F; border-radius: 10px; padding: 2px; height: 36px; box-sizing: border-box; margin-bottom: 14px">
    <a href="Squad.dc.html" style="color: #C7C7CC; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center">Board</a>
    <a href="Leaderboard.dc.html" aria-current="page" style="border-radius: 8px; background: #3A3A3F; color: #F5F5F7; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">Leaderboard</a>
    <a href="Plan.dc.html" style="color: #C7C7CC; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center">Plan</a>
  </nav>

  <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px">
    <button aria-pressed="true" style="height: 32px; padding: 0 14px; border: 0; border-radius: 16px; background: #F5F5F7; color: #000; font-size: 13px; font-weight: 600; cursor: pointer">This challenge</button>
    <button aria-pressed="false" style="height: 32px; padding: 0 14px; border: 0; border-radius: 16px; background: #1C1C1F; color: #C7C7CC; font-size: 13px; font-weight: 500; cursor: pointer">This week</button>
  </div>
  <p style="margin: 0 0 12px 2px; font-size: 13px; color: #A1A1A8">Score is the share of days checked in. Ties go to tasks done.</p>

  <ol style="list-style: none; margin: 0; padding: 0 16px; background: #151517; border-radius: 16px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
      <li style="{{r.rowStyle}}">
        <span style="width: 20px; font-size: 15px; font-weight: 600; color: #A1A1A8; font-variant-numeric: tabular-nums; text-align: right">{{r.rank}}</span>
        <span style="{{r.avStyle}}">{{r.init}}</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
          <span style="{{r.nameStyle}}">{{r.name}}</span>
          <span style="font-size: 12px; color: #A1A1A8">{{r.sub}}</span>
        </span>
        <span style="font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums">{{r.score}}</span>
      </li>
    </sc-for>
  </ol>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: rgba(14,14,16,0.94); border-top: 0.5px solid rgba(84,84,88,0.6); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; padding-top: 6px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #9A9AA0; font-size: 11px; font-weight: 500; padding-top: 4px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>Today</a>
    <a href="Squad.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #FFB224; font-size: 11px; font-weight: 500; padding-top: 4px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/></svg>Squads</a>
    <a href="CheckIn.dc.html" aria-label="Check in" style="justify-self: center; width: 56px; height: 56px; margin-top: -14px; border-radius: 28px; background: #FFB224; color: #1A1200; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(255,178,36,0.28)">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></a>
    <a href="Discover.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #9A9AA0; font-size: 11px; font-weight: 500; padding-top: 4px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Discover</a>
    <a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #9A9AA0; font-size: 11px; font-weight: 500; padding-top: 4px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20.5c1.2-4 4.3-6 8-6s6.8 2 8 6"/></svg>You</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var data = [
      ['DV', 'Divya', '12 of 12 days, 36 tasks', '100%', '#3B3A5C'],
      ['Y', 'You', '12 of 12 days, 34 tasks', '100%', '#2F2F4A'],
      ['AR', 'Arun', '11 of 12 days', '92%', '#2F4A45'],
      ['ME', 'Meena', '11 of 12 days', '92%', '#3A2F4A'],
      ['SK', 'Sanjay', '10 of 12 days', '83%', '#4A3A2F'],
      ['RH', 'Rahul', '9 of 12 days', '75%', '#2F3F4A'],
      ['KV', 'Kavya', '8 of 12 days', '67%', '#4A2F3A'],
      ['VG', 'Vignesh', '7 of 12 days', '58%', '#3F4A2F'],
      ['NI', 'Nisha', '5 of 12 days', '42%', '#4A442F']
    ];
    var rows = data.map(function (d, i) {
      var me = d[1] === 'You';
      return {
        rank: String(i + 1),
        init: d[0],
        name: d[1],
        sub: d[2],
        score: d[3],
        rowStyle: 'display: flex; align-items: center; gap: 12px; height: 52px; ' + (i ? 'border-top: 0.5px solid rgba(84,84,88,0.6); ' : '') + (me ? 'background: rgba(255,178,36,0.12); margin: 0 -16px; padding: 0 16px; border-top-color: transparent;' : ''),
        avStyle: 'width: 32px; height: 32px; flex: none; border-radius: 16px; background: ' + d[4] + '; color: #E6E6EA; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center;',
        nameStyle: 'font-size: 15px; font-weight: ' + (me ? '600' : '500') + '; color: ' + (me ? '#FFB224' : '#F5F5F7') + ';'
      };
    });
    return { rows: rows };
  }
}
</script>
</body>
</html>
