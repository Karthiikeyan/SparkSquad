<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Discover</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#FFB224;text-decoration:none}a:hover{color:#FFC75C}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #F5F5F7; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden; padding: 60px 16px 0">

  <h1 style="margin: 0 0 12px; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -0.5px; line-height: 40px">Discover</h1>

  <div style="position: relative; margin-bottom: 12px">
    <label for="search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search squads and plans</label>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E8E95" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 12px; top: 11px"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
    <input id="search" type="search" placeholder="Search squads and plans" style="width: 100%; box-sizing: border-box; height: 40px; border: 0; border-radius: 12px; background: #1C1C1F; color: #F5F5F7; padding: 0 12px 0 38px; font-size: 15px; outline-color: #FFB224">
  </div>

  <div style="display: flex; gap: 8px; margin-bottom: 20px">
    <button aria-pressed="true" style="height: 34px; padding: 0 14px; border: 0; border-radius: 17px; background: #F5F5F7; color: #000; font-size: 14px; font-weight: 600; cursor: pointer">Career</button>
    <button aria-pressed="false" style="height: 34px; padding: 0 14px; border: 0; border-radius: 17px; background: #1C1C1F; color: #C7C7CC; font-size: 14px; cursor: pointer">Fitness</button>
    <button aria-pressed="false" style="height: 34px; padding: 0 14px; border: 0; border-radius: 17px; background: #1C1C1F; color: #C7C7CC; font-size: 14px; cursor: pointer">Learning</button>
  </div>

  <h2 style="margin: 0 4px 8px; font-size: 17px; font-weight: 600">Squads starting soon</h2>
  <section style="background: #151517; border-radius: 18px; padding: 0 16px; margin-bottom: 20px">
    <sc-for list="{{squads}}" as="s" hint-placeholder-count="3">
      <div style="{{s.rowStyle}}">
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <span style="font-size: 16px; font-weight: 600">{{s.name}}</span>
          <span style="font-size: 13px; color: #A1A1A8">{{s.plan}}</span>
          <span style="font-size: 13px; color: #A1A1A8">{{s.meta}}</span>
        </span>
        <button style="height: 34px; padding: 0 16px; border: 0; border-radius: 17px; background: rgba(255,178,36,0.14); color: #FFB224; font-size: 14px; font-weight: 600; cursor: pointer">Join</button>
      </div>
    </sc-for>
  </section>

  <div style="display: flex; justify-content: space-between; align-items: baseline; margin: 0 4px 8px">
    <h2 style="margin: 0; font-size: 17px; font-weight: 600">Plan templates</h2>
    <a href="CreateSquad.dc.html" style="font-size: 15px">Start a squad</a>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{templates}}" as="t" hint-placeholder-count="4">
      <a href="CreateSquad.dc.html" style="background: #151517; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px; color: #F5F5F7">
        <span style="font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 20px; font-weight: 600; line-height: 24px">{{t.name}}</span>
        <span style="font-size: 13px; color: #A1A1A8">{{t.meta}}</span>
      </a>
    </sc-for>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: rgba(14,14,16,0.94); border-top: 0.5px solid rgba(84,84,88,0.6); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; padding-top: 6px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #9A9AA0; font-size: 11px; font-weight: 500; padding-top: 4px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>Today</a>
    <a href="Squad.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #9A9AA0; font-size: 11px; font-weight: 500; padding-top: 4px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/></svg>Squads</a>
    <a href="CheckIn.dc.html" aria-label="Check in" style="justify-self: center; width: 56px; height: 56px; margin-top: -14px; border-radius: 28px; background: #FFB224; color: #1A1200; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(255,178,36,0.28)">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></a>
    <a href="Discover.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #FFB224; font-size: 11px; font-weight: 500; padding-top: 4px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Discover</a>
    <a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #9A9AA0; font-size: 11px; font-weight: 500; padding-top: 4px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20.5c1.2-4 4.3-6 8-6s6.8 2 8 6"/></svg>You</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var list = [
      { name: 'Product Company Prep', plan: 'DSA 60, 3 tasks a day', meta: '64 of 100 joined, starts Monday 3 November' },
      { name: 'Aptitude Before Placements', plan: 'Aptitude 21, 2 tasks a day', meta: '38 of 100 joined, starts Tuesday 4 November' },
      { name: 'SQL Every Morning', plan: 'SQL 30, 1 task a day', meta: '17 of 50 joined, starts Saturday 8 November' }
    ];
    var squads = list.map(function (s, i) {
      return Object.assign({}, s, { rowStyle: 'display: flex; align-items: center; gap: 12px; padding: 12px 0; ' + (i ? 'border-top: 0.5px solid rgba(84,84,88,0.6);' : '') });
    });
    return {
      squads: squads,
      templates: [
        { name: 'DSA 30', meta: '30 days, 3 tasks a day' },
        { name: 'Aptitude 21', meta: '21 days, 2 tasks a day' },
        { name: 'SQL 30', meta: '30 days, 1 task a day' },
        { name: '10K steps', meta: '30 days, synced from your phone' }
      ]
    };
  }
}
</script>
</body>
</html>
