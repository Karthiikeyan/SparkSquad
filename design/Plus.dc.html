<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SparkSquad Plus</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#FFB224;text-decoration:none}a:hover{color:#FFC75C}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #F5F5F7; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden; padding: 52px 16px 34px; display: flex; flex-direction: column">

  <div style="display: flex; justify-content: flex-end; height: 44px; align-items: center">
    <a href="Profile.dc.html" aria-label="Close" style="width: 36px; height: 36px; border-radius: 18px; background: #1C1C1F; color: #D6D6DB; display: flex; align-items: center; justify-content: center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
  </div>

  <h1 style="margin: 0 0 6px; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 34px; font-weight: 700; line-height: 40px; letter-spacing: -0.5px">SparkSquad Plus</h1>
  <p style="margin: 0 0 18px; font-size: 16px; line-height: 22px; color: #A1A1A8">For people working on more than one goal at a time. Checking in and your streaks stay free forever.</p>

  <table style="width: 100%; border-collapse: collapse; background: #151517; border-radius: 16px; overflow: hidden; font-size: 14px">
    <thead>
      <tr style="color: #A1A1A8; font-size: 12px; text-align: left">
        <th scope="col" style="padding: 12px 14px 6px; font-weight: 500"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Feature</span></th>
        <th scope="col" style="padding: 12px 8px 6px; font-weight: 500">Free</th>
        <th scope="col" style="padding: 12px 14px 6px 8px; font-weight: 600; color: #FFB224">Plus</th>
      </tr>
    </thead>
    <tbody>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <tr style="border-top: 0.5px solid rgba(84,84,88,0.6)">
          <th scope="row" style="padding: 11px 14px; font-weight: 500; text-align: left; color: #F5F5F7">{{r.f}}</th>
          <td style="padding: 11px 8px; color: #A1A1A8">{{r.free}}</td>
          <td style="padding: 11px 14px 11px 8px; color: #F5F5F7; font-weight: 500">{{r.plus}}</td>
        </tr>
      </sc-for>
    </tbody>
  </table>

  <fieldset style="border: 0; padding: 0; margin: 16px 0 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Billing period</legend>
    <label style="border: 2px solid #FFB224; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; position: relative; background: rgba(255,178,36,0.08)">
      <input type="radio" name="period" checked="" style="position: absolute; opacity: 0">
      <span style="font-size: 13px; color: #FFB224; font-weight: 600">Yearly, save 33%</span>
      <span style="font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums">₹799</span>
      <span style="font-size: 12px; color: #A1A1A8">About ₹67 a month</span>
    </label>
    <label style="border: 1px solid #3A3A3F; border-radius: 16px; padding: 13px 15px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; position: relative">
      <input type="radio" name="period" style="position: absolute; opacity: 0">
      <span style="font-size: 13px; color: #A1A1A8; font-weight: 500">Monthly</span>
      <span style="font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums">₹99</span>
      <span style="font-size: 12px; color: #A1A1A8">Billed every month</span>
    </label>
  </fieldset>

  <div style="flex: 1"></div>
  <button style="height: 52px; border: 0; border-radius: 14px; background: #FFB224; color: #1A1200; font-size: 17px; font-weight: 600; cursor: pointer">Start Plus</button>
  <div style="display: flex; justify-content: space-between; margin-top: 12px; font-size: 13px">
    <a href="#">Restore purchase</a>
    <a href="#">Running a cohort? See Squad Pro</a>
  </div>
  <p style="margin: 10px 0 0; font-size: 12px; line-height: 17px; color: #8E8E95; text-align: center">Cancel anytime in your Play Store or App Store subscriptions.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { f: 'Squads you’re in', free: '3', plus: '10' },
        { f: 'Squads you own', free: '1', plus: '5' },
        { f: 'Photo proof', free: 'On your phone', plus: 'Shared, 30 days' },
        { f: 'Streak freezes', free: '2', plus: '5' },
        { f: 'Weekly recap', free: 'Summary', plus: 'AI-written' },
        { f: 'Plan builder', free: 'Copy prompt', plus: 'In the app' }
      ]
    };
  }
}
</script>
</body>
</html>
